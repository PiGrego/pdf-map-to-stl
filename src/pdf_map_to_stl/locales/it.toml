[parts]
heading = "PARTI DI: {title}"
intro = """Ogni file è uno strato dello stesso oggetto. Tutti i file usano lo stesso sistema di
coordinate (millimetri, origine nell'angolo in basso a sinistra della tavoletta, z in su
dal tavolo), e le parti si toccano senza sovrapporsi. Caricate insieme come UN solo
oggetto in più parti, combaciano esattamente."""
how = """COME CARICARLE
- Bambu Studio, OrcaSlicer: importa tutti i file insieme; quando chiede se caricarli
  come un solo oggetto con più parti, rispondi Sì.
- PrusaSlicer: importa tutti i file insieme; fa la stessa domanda quando il profilo della
  stampante ha più di un estrusore. Altrimenti carica 00_base.stl e aggiungi le altre con
  clic destro > Aggiungi parte > Carica, e controlla che combacino.
- Non caricarle come oggetti separati: lo slicer appoggia ciascuno sul piatto e lo sposta."""
then = """Poi dai a ogni parte le sue impostazioni: filamento o colore, fuzzy skin o stiratura
per la texture, un motivo della superficie superiore come la curva di Hilbert (per i
portici, se non hanno una texture propria), e così via. model.stl è lo stesso modello in
un corpo solo, per stampe con un solo materiale."""
