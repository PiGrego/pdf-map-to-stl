<!doctype html>
<!--
  Window picker for pdf-map-to-stl. Generated by pick.py: the page data is injected where
  PAGE_DATA appears below. Edit this template, not the generated pick.html.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Window Picker</title>
<style>
  :root { --bg: #f4f4f2; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc; --sel: #d0021b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 380px; height: 100%; }
  #stage { overflow: auto; padding: 16px; }
  #wrap { position: relative; display: inline-block; cursor: crosshair; user-select: none; }
  #wrap img { display: block; max-width: none; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #overlay .shape { fill: rgba(208,2,27,.08); stroke: var(--sel); stroke-width: 2; vector-effect: non-scaling-stroke; }
  #overlay .open { fill: none; stroke-dasharray: 6 4; }
  #overlay circle { fill: var(--sel); }
  #overlay .geo { fill: #1a5fb4; stroke: #fff; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  #overlay text { fill: #fff; font: bold 3px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .geo-row { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  .geo-row input[type=text] { width: 100%; font: inherit; padding: 2px 4px; }
  .bad { color: #a00; }
  main { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; word-break: break-all; margin-bottom: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  pre { background: #f6f6f3; border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    white-space: pre-wrap; word-break: break-all; font-size: 12px; margin: 6px 0; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fafaf8; cursor: pointer; }
  .hint { color: var(--muted); font-size: 12px; }
  label { display: block; margin: 6px 0; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0; padding: 6px 10px; }
  input[type=number] { width: 90px; font: inherit; padding: 2px 4px; }
  textarea { width: 100%; font: 12px/1.4 ui-monospace, Consolas, monospace; padding: 4px; }
  @media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } }
  .crop { display: grid; grid-template-columns: repeat(2, auto 90px); gap: 6px 8px; align-items: center; justify-content: start; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .row label { display: inline-flex; gap: 4px; margin: 0 12px 0 0; }
  :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
</style>
</head>
<body>
<div id="app">
  <section id="stage" data-t-aria="map_page">
    <div id="wrap"><img id="page" alt=""><svg id="overlay" aria-hidden="true"></svg></div>
  </section>
  <main>
    <h1 data-t="heading"></h1>
    <div class="sub" id="source"></div>
    <div class="row"><label><span data-t="map_scale"></span><input id="mscale" type="number" min="500" max="100000"
      step="500" data-t-aria="map_scale_aria"></label></div>
    <p class="hint" id="mscaleHint"></p>
    <fieldset>
      <legend data-t="shape"></legend>
      <div class="row">
        <label><input type="radio" name="mode" value="rect" checked> <span data-t="rectangle"></span></label>
        <label><input type="radio" name="mode" value="poly"> <span data-t="polygon"></span></label>
        <label><input type="radio" name="mode" value="fixed"> <span data-t="fixed_size"></span></label>
      </div>
    </fieldset>
    <div id="fixedBox" hidden>
      <div class="row">
        <label><span data-t="plate"></span> <input id="plateW" type="number" min="50" max="1000" step="1" value="170"
          data-t-aria="plate_width"> × <input id="plateH" type="number" min="50" max="1000" step="1" value="170"
          data-t-aria="plate_height"> mm</label>
      </div>
      <div class="row">
        <label><span data-t="tactile_scale"></span><input id="tscale" type="number" min="100" max="100000" step="50"
          value="1000" data-t-aria="tactile_scale_aria"></label>
      </div>
      <p class="hint" id="fixedInfo" role="status" aria-live="polite"></p>
    </div>
    <p class="hint" id="howto"></p>
    <div class="row"><button id="zin" data-t="zoom_in"></button><button id="zout" data-t="zoom_out"></button>
      <button id="undo" data-t="undo"></button><button id="close" data-t="close"></button>
      <button id="clear" data-t="clear"></button></div>

    <h2 data-t="window_heading"></h2>
    <form id="cropForm" class="crop">
      <label for="cx0" data-t="left"></label><input id="cx0" type="number" step="0.5" min="0">
      <label for="cy0" data-t="top"></label><input id="cy0" type="number" step="0.5" min="0">
      <label for="cx1" data-t="right"></label><input id="cx1" type="number" step="0.5" min="0">
      <label for="cy1" data-t="bottom"></label><input id="cy1" type="number" step="0.5" min="0">
    </form>
    <label for="points" data-t="points"></label>
    <textarea id="points" rows="3" placeholder="70,190, 120,190, 120,227, 90,227"></textarea>
    <pre id="crop" role="status" aria-live="polite"></pre>

    <h2 data-t="geo_heading"></h2>
    <p class="hint" data-t="geo_hint"></p>
    <div class="row"><button id="addGeo" data-t="add_point"></button></div>
    <div id="geoRows"></div>
    <p id="geoStatus" class="hint" role="status" aria-live="polite"></p>

    <h2 data-t="size_heading"></h2>
    <div id="widthBox">
    <label><span data-t="width"></span> <input id="width" type="number" min="20" max="1000" step="10"
      data-t-placeholder="auto"> mm</label>
    <div class="hint" id="scale" data-t="width_hint"></div>
    </div>
    <p class="hint" id="widthFixed" hidden data-t="width_fixed"></p>

    <h2 data-t="options_heading"></h2>
    <label><span data-t="language"></span> <select id="lang"></select></label>
    <label><input type="checkbox" id="scalebar" checked> <span data-t="scale_bar"></span></label>
    <label><input type="checkbox" id="slopes"> <span data-t="slopes"></span></label>
    <p class="hint" data-t="slopes_hint"></p>

    <h2 data-t="command_heading"></h2>
    <p class="hint" data-t="run_from"></p>
    <pre id="cmd"></pre>
    <button id="copy" data-t="copy"></button>
  </main>
</div>
<script>
const PAGE = /*__PAGE_DATA__*/null;
const $ = id => document.getElementById(id);
const img = $("page"), wrap = $("wrap"), svg = $("overlay");
let zoom = 1, mode = "rect", rect = null, pts = [], closed = false, drag = null;
let geo = [], placing = false;  // position points: {x, y, text}
let centre = null, moving = false;  // fixed size: the middle of the plate on the page (mm)

// Texts in the page's language (locales/<lang>.toml, section [pick]).
const T = (key, values = {}) => (PAGE.text[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => values[k] ?? "");
document.documentElement.lang = PAGE.lang;
document.title = T("page_title");
document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = T(el.dataset.t); });
document.querySelectorAll("[data-t-aria]").forEach(el => el.setAttribute("aria-label", T(el.dataset.tAria)));
document.querySelectorAll("[data-t-placeholder]").forEach(el => { el.placeholder = T(el.dataset.tPlaceholder); });
for (const [code, name] of Object.entries(PAGE.languages)) {
  const o = document.createElement("option"); o.value = code; o.textContent = name; o.selected = code === PAGE.lang;
  $("lang").appendChild(o);
}

img.src = PAGE.image;
img.alt = T("img_alt");
$("source").textContent = T("source", { pdf: PAGE.pdf, page: PAGE.page + 1, pages: PAGE.pages, w: PAGE.width_mm,
                                        h: PAGE.height_mm });
const HOWTO = { rect: T("howto_rect"), poly: T("howto_poly"), fixed: T("howto_fixed") };
$("mscale").value = PAGE.map_scale || "";
$("mscaleHint").textContent = PAGE.map_scale ? T("mscale_read") : T("mscale_missing");

const baseWidth = () => Math.min(window.innerWidth - 440, 1400);
function layout() { img.style.width = baseWidth() * zoom + "px"; draw(); }
const mmPerPx = () => PAGE.width_mm / img.clientWidth;
const f = v => v.toFixed(1);

function toMm(ev) {
  const r = img.getBoundingClientRect();
  const x = Math.max(0, Math.min(r.width, ev.clientX - r.left)), y = Math.max(0, Math.min(r.height, ev.clientY - r.top));
  return [x * mmPerPx(), y * mmPerPx()];
}

function draw() {
  svg.setAttribute("viewBox", `0 0 ${PAGE.width_mm} ${PAGE.height_mm}`);
  svg.setAttribute("preserveAspectRatio", "none");
  let html = "";
  const fr = mode === "fixed" ? fixedRect() : null;
  if (mode === "rect" && rect) {
    html = `<rect class="shape" x="${rect[0]}" y="${rect[1]}" width="${rect[2] - rect[0]}" height="${rect[3] - rect[1]}"/>`;
  } else if (fr) {
    const cx = (fr[0] + fr[2]) / 2, cy = (fr[1] + fr[3]) / 2, d = 6 * mmPerPx();
    html = `<rect class="shape" x="${fr[0]}" y="${fr[1]}" width="${fr[2] - fr[0]}" height="${fr[3] - fr[1]}"/>`
      + `<path class="shape" d="M${cx - d},${cy} H${cx + d} M${cx},${cy - d} V${cy + d}"/>`;
  } else if (mode === "poly" && pts.length) {
    const list = pts.map(p => p.join(",")).join(" ");
    html = closed ? `<polygon class="shape" points="${list}"/>` : `<polyline class="shape open" points="${list}"/>`;
    const r = 0.6 * mmPerPx() * 4;
    html += pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${r}"/>`).join("");
  }
  geo.forEach((g, i) => {
    html += `<circle class="geo" cx="${g.x}" cy="${g.y}" r="2.2"/><text x="${g.x}" y="${g.y}">${i + 1}</text>`;
  });
  svg.innerHTML = html;
}

// Fixed size: the part of the page that fills a plate of the typed size at the typed
// scale. The margins are the usual ones (one line of Braille title, north symbols); the
// build keeps the plate at exactly this size even if the title needs more room.
function fixedSize() {
  const W = Number($("plateW").value), H = Number($("plateH").value);
  const N = Number($("tscale").value), M = Number($("mscale").value);
  if (!(W > 0 && H > 0 && N > 0 && M > 0)) return null;
  const k = M / N, mapH = H - PAGE.margins_mm[0] - PAGE.margins_mm[1];  // k: plate mm per page mm
  return { W, H, N, M, mapH, w: W / k, h: Math.max(mapH, 0) / k };
}
function fixedRect() {
  const s = fixedSize();
  if (!s || s.mapH <= 0 || !centre) return null;
  const x0 = Math.min(Math.max(centre[0] - s.w / 2, 0), Math.max(0, PAGE.width_mm - s.w));
  const y0 = Math.min(Math.max(centre[1] - s.h / 2, 0), Math.max(0, PAGE.height_mm - s.h));
  return [x0, y0, x0 + s.w, y0 + s.h];
}
function fixedInfo() {
  const s = fixedSize(), el = $("fixedInfo");
  let text, bad = true;
  if (!$("mscale").value) text = T("fixed_no_scale");
  else if (!s) text = T("fixed_missing");
  else if (s.mapH <= 0) text = T("fixed_no_room", { h: s.H, margins: PAGE.margins_mm[0] + PAGE.margins_mm[1] });
  else if (s.w > PAGE.width_mm || s.h > PAGE.height_mm) text = T("fixed_too_big", { n: s.N, w: f(s.w), h: f(s.h) });
  else {
    bad = false;
    text = T("fixed_ok", { W: s.W, mapH: f(s.mapH), w: f(s.w), h: f(s.h) });
  }
  el.textContent = text;
  el.className = bad ? "hint bad" : "hint";
}

// The window as --crop numbers: 4 for a rectangle (or a fixed size), 6 or more for a polygon.
function window_() {
  if (mode === "fixed") return fixedRect();
  if (mode === "rect") return rect ? rect : null;
  return closed && pts.length >= 3 ? pts.flat() : null;
}

wrap.addEventListener("pointerdown", ev => {
  const p = toMm(ev);
  if (placing) {
    placing = false;
    geo.push({ x: p[0], y: p[1], text: "" });
    $("geoStatus").textContent = T("geo_placed", { n: geo.length, x: f(p[0]), y: f(p[1]) });
    geoRows();
    update(false);
    $(`geoText${geo.length - 1}`).focus();
    return;
  }
  if (mode === "fixed") { centre = p; moving = true; wrap.setPointerCapture(ev.pointerId); update(); return; }
  if (mode === "poly") {
    if (closed) { pts = []; closed = false; }
    const first = pts[0], near = first && Math.hypot(first[0] - p[0], first[1] - p[1]) < 8 * mmPerPx();
    if (near && pts.length >= 3) closed = true; else pts.push(p);
    update();
    return;
  }
  drag = p; rect = null; wrap.setPointerCapture(ev.pointerId); update();
});
wrap.addEventListener("pointermove", ev => {
  if (moving) { centre = toMm(ev); update(); return; }
  if (!drag) return;
  const p = toMm(ev);
  rect = [Math.min(drag[0], p[0]), Math.min(drag[1], p[1]), Math.max(drag[0], p[0]), Math.max(drag[1], p[1])];
  update();
});
wrap.addEventListener("pointerup", () => {
  moving = false;
  if (!drag) return;
  drag = null;
  if (rect && (rect[2] - rect[0] < 2 || rect[3] - rect[1] < 2)) rect = null;   // a click, not a drag
  update();
});

function command() {
  const q = s => /\s/.test(s) ? `"${s}"` : s;
  let c = `pdf-map-to-stl build ${q(PAGE.pdf)}`;
  if (PAGE.page) c += ` --page ${PAGE.page}`;
  const w = window_();
  if (w) c += ` --crop ${w.map(f).join(",")}`;
  const M = Number($("mscale").value);
  if (M > 0 && M !== PAGE.map_scale) c += ` --map-scale ${M}`;
  const s = mode === "fixed" && w ? fixedSize() : null;
  if (s) c += ` --plate ${s.W},${s.H} --scale ${s.N}`;
  else if (mode !== "fixed" && $("width").value) c += ` --width ${$("width").value}`;
  c += ` --lang ${$("lang").value}`;
  if (!$("scalebar").checked) c += " --set features.scale_bar=false";
  if ($("slopes").checked) c += " --set relief.enabled=true";
  for (const g of geo) {
    const ll = parseLatLon(g.text);
    if (ll) c += ` --geo ${f(g.x)},${f(g.y)},${ll[0].toFixed(7)},${ll[1].toFixed(7)}`;
  }
  return c;
}

// Coordinates in any common form: "44.51234, 11.34567", "44.51234 N 11.34567 E",
// "44°30'44.4"N 11°20'44.4"E". Returns [lat, lon] in decimal degrees, or null.
function parseOne(t, axis) {
  const s = t.trim().toUpperCase().replace(/,/g, ".");
  const hemi = s.match(/[NSEW]/g) || [], nums = (s.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
  if (!nums.length || nums.length > 3 || hemi.length > 1) return null;
  let v = Math.abs(nums[0]) + (nums[1] || 0) / 60 + (nums[2] || 0) / 3600;
  if (nums[0] < 0 || (hemi[0] && "SW".includes(hemi[0]))) v = -v;
  if (hemi[0] && ("NS".includes(hemi[0])) !== (axis === "lat")) return null;
  return Math.abs(v) <= (axis === "lat" ? 90 : 180) ? v : null;
}
function parseLatLon(text) {
  const t = text.trim();
  if (!t) return null;
  let parts = t.split(/\s*[,;]\s*/);
  if (parts.length !== 2) {  // "44.5 N 11.3 E" or DMS without a comma: split after the first hemisphere letter
    const m = t.match(/^(.*?[NS])\s*(.+)$/i);
    parts = m ? [m[1], m[2]] : parts;
  }
  if (parts.length !== 2) return null;
  const lat = parseOne(parts[0], "lat"), lon = parseOne(parts[1], "lon");
  return lat === null || lon === null ? null : [lat, lon];
}
function geoRows() {
  const box = $("geoRows");
  box.innerHTML = "";
  geo.forEach((g, i) => {
    const div = document.createElement("div");
    div.className = "geo-row";
    div.innerHTML = `<strong>${T("point", { n: i + 1 })}</strong> (${i ? T("two_pins") : T("one_pin")}) ${T("at")}
      <label style="display:inline">x <input id="geoX${i}" type="number" step="0.1" value="${f(g.x)}"></label>
      <label style="display:inline">y <input id="geoY${i}" type="number" step="0.1" value="${f(g.y)}"></label> mm
      <label for="geoText${i}">${T("lat_lon")}</label>
      <input type="text" id="geoText${i}" value="${g.text.replace(/"/g, "&quot;")}" placeholder="44.51234, 11.34567"
        aria-describedby="geoOk${i}">
      <div id="geoOk${i}" class="hint"></div>
      <button id="geoDel${i}">${T("remove_point", { n: i + 1 })}</button>`;
    box.appendChild(div);
    const check = () => {
      const ll = parseLatLon(g.text);
      $(`geoOk${i}`).textContent = !g.text ? T("not_set") : ll ? T("read_as", { lat: ll[0].toFixed(6), lon: ll[1].toFixed(6) })
        : T("cannot_read");
      $(`geoOk${i}`).className = !g.text || ll ? "hint" : "hint bad";
    };
    $(`geoText${i}`).addEventListener("input", e => { g.text = e.target.value; check(); update(false); });
    $(`geoX${i}`).addEventListener("change", e => { g.x = Number(e.target.value); update(false); });
    $(`geoY${i}`).addEventListener("change", e => { g.y = Number(e.target.value); update(false); });
    $(`geoDel${i}`).addEventListener("click", () => { geo.splice(i, 1); geoRows(); update(false); });
    check();
  });
  $("addGeo").disabled = geo.length >= 2;
}
$("addGeo").addEventListener("click", () => {
  placing = true;
  $("geoStatus").textContent = T("click_place", { n: geo.length + 1 });
});

function update(syncFields = true) {
  draw();
  const w = window_();
  if (syncFields) {
    const shown = mode === "rect" ? rect : mode === "fixed" ? w : null;
    rectFields.forEach((el, i) => { el.value = shown ? f(shown[i]) : ""; el.disabled = mode === "fixed" && i >= 2; });
    $("points").value = mode === "poly" && pts.length ? pts.map(p => p.map(f).join(",")).join(", ") : "";
  }
  let text = T("whole_page");
  if (w) {
    const xs = w.filter((_, i) => i % 2 === 0), ys = w.filter((_, i) => i % 2 === 1);
    const bw = Math.max(...xs) - Math.min(...xs), bh = Math.max(...ys) - Math.min(...ys);
    const kind = mode === "rect" ? T("kind_rect") : mode === "fixed" ? T("kind_fixed") : T("kind_poly", { n: pts.length });
    text = `--crop ${w.map(f).join(",")}\n` + T("crop_info", { kind, w: f(bw), h: f(bh) });
  } else if (mode === "fixed") {
    text = T("fixed_see");
  } else if (mode === "poly" && pts.length) {
    text = pts.length > 1 ? T("points_n", { n: pts.length }) : T("points_1");
  }
  $("crop").textContent = text;
  $("cmd").textContent = command();
  fixedInfo();
  $("undo").disabled = mode !== "poly" || !pts.length;
  $("close").disabled = mode !== "poly" || closed || pts.length < 3;
}

document.querySelectorAll("input[name=mode]").forEach(r => r.addEventListener("change", () => {
  mode = r.value; $("howto").textContent = HOWTO[mode];
  if (mode === "fixed" && !centre) {  // start where the rectangle was, or in the middle of the page
    centre = rect ? [(rect[0] + rect[2]) / 2, (rect[1] + rect[3]) / 2] : [PAGE.width_mm / 2, PAGE.height_mm / 2];
  }
  $("fixedBox").hidden = $("widthFixed").hidden = mode !== "fixed";
  $("widthBox").hidden = mode === "fixed";
  update();
}));
["plateW", "plateH", "tscale", "mscale"].forEach(id => $(id).addEventListener("input", () => update()));
$("slopes").addEventListener("change", () => update(false));
$("lang").addEventListener("change", () => update(false));
$("scalebar").addEventListener("change", () => update(false));
$("howto").textContent = HOWTO[mode];
$("width").addEventListener("input", () => update(false));
$("zin").addEventListener("click", () => { zoom = Math.min(8, zoom * 1.5); layout(); });
$("zout").addEventListener("click", () => { zoom = Math.max(0.25, zoom / 1.5); layout(); });
$("clear").addEventListener("click", () => { rect = null; pts = []; closed = false; centre = null; update(); });
$("undo").addEventListener("click", () => { closed = false; pts.pop(); update(); });
$("close").addEventListener("click", () => { if (pts.length >= 3) closed = true; update(); });

// Typed window: exact values, the same as drawing.
const rectFields = ["cx0", "cy0", "cx1", "cy1"].map(id => $(id));
rectFields[0].max = rectFields[2].max = PAGE.width_mm; rectFields[1].max = rectFields[3].max = PAGE.height_mm;
function fromRectFields() {
  if (mode === "fixed") {  // Left and Top move the plate; its size stays
    const s = fixedSize(), l = Number(rectFields[0].value), t = Number(rectFields[1].value);
    if (s && rectFields[0].value !== "" && rectFields[1].value !== "") centre = [l + s.w / 2, t + s.h / 2];
    update();
    return;
  }
  const v = rectFields.map(el => Number(el.value));
  if (rectFields.some(el => el.value === "") || v.some(Number.isNaN)) return;
  const r = [Math.min(v[0], v[2]), Math.min(v[1], v[3]), Math.max(v[0], v[2]), Math.max(v[1], v[3])];
  rect = [Math.max(0, r[0]), Math.max(0, r[1]), Math.min(PAGE.width_mm, r[2]), Math.min(PAGE.height_mm, r[3])];
  if (rect[2] - rect[0] < 1 || rect[3] - rect[1] < 1) rect = null;
  document.querySelector("input[value=rect]").checked = true; mode = "rect"; $("howto").textContent = HOWTO.rect;
  update(false);
}
function fromPoints() {
  const v = $("points").value.split(/[,\s;]+/).filter(Boolean).map(Number);
  if (v.some(Number.isNaN) || v.length < 6 || v.length % 2) { $("crop").textContent = "Type at least 3 points: x,y, x,y, x,y"; return; }
  pts = []; for (let i = 0; i < v.length; i += 2) pts.push([v[i], v[i + 1]]);
  closed = true;
  document.querySelector("input[value=poly]").checked = true; mode = "poly"; $("howto").textContent = HOWTO.poly;
  update(false);
}
rectFields.forEach(el => el.addEventListener("change", fromRectFields));
$("points").addEventListener("change", fromPoints);
$("cropForm").addEventListener("submit", e => { e.preventDefault(); fromRectFields(); });
$("copy").addEventListener("click", () => navigator.clipboard?.writeText(command()));
window.addEventListener("resize", layout);
img.addEventListener("load", () => { layout(); update(); });
</script>
</body>
