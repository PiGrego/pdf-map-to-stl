<!doctype html>
<!--
  Area picker for pdf-map-to-stl. Generated by pick.py: the page data is injected where
  PAGE_DATA appears below. Edit this template, not the generated pick.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Area Picker</title>
<style>
  :root { --bg: #f4f4f2; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc; --sel: #d0021b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 360px; height: 100%; }
  #stage { overflow: auto; padding: 16px; }
  #wrap { position: relative; display: inline-block; cursor: crosshair; user-select: none; }
  #wrap img { display: block; max-width: none; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #sel { position: absolute; border: 2px solid var(--sel); background: rgba(208,2,27,.08); display: none; pointer-events: none; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; word-break: break-all; margin-bottom: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  pre { background: #f6f6f3; border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    white-space: pre-wrap; word-break: break-all; font-size: 12px; margin: 6px 0; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fafaf8; cursor: pointer; }
  .hint { color: var(--muted); font-size: 12px; }
  label { display: block; margin: 6px 0; }
  input[type=number] { width: 90px; font: inherit; padding: 2px 4px; }
  @media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="wrap"><img id="page" alt="map page"><div id="sel"></div></div></div>
  <aside>
    <h1>Pick the map area</h1>
    <div class="sub" id="source"></div>
    <p class="hint">Drag a rectangle on the map. Use the zoom buttons for precision. Leave it empty to convert the whole page.</p>
    <div><button id="zin">Zoom +</button> <button id="zout">Zoom −</button> <button id="clear">Clear</button></div>

    <h2>Selection (mm from top-left)</h2>
    <pre id="crop">Whole page</pre>

    <h2>Model width</h2>
    <label>Printed width <input id="width" type="number" min="20" max="600" step="10" value="120"> mm</label>
    <div class="hint" id="scale"></div>

    <h2>Command</h2>
    <p class="hint">Run from the project folder:</p>
    <pre id="cmd"></pre>
    <button id="copy">Copy command</button>
  </aside>
</div>
<script>
const PAGE = /*__PAGE_DATA__*/null;
const img = document.getElementById("page"), wrap = document.getElementById("wrap"), sel = document.getElementById("sel");
let zoom = 1, rect = null, drag = null;

img.src = PAGE.image;
document.getElementById("source").textContent =
  `${PAGE.pdf} · page ${PAGE.page + 1}/${PAGE.pages} · ${PAGE.width_mm} × ${PAGE.height_mm} mm`;

const baseWidth = () => Math.min(window.innerWidth - 420, 1400);
function layout() { img.style.width = baseWidth() * zoom + "px"; drawSel(); }
const mmPerPx = () => PAGE.width_mm / img.clientWidth;

function toMm(ev) {
  const r = img.getBoundingClientRect();
  const x = Math.max(0, Math.min(r.width, ev.clientX - r.left)), y = Math.max(0, Math.min(r.height, ev.clientY - r.top));
  return [x * mmPerPx(), y * mmPerPx()];
}
function drawSel() {
  if (!rect) { sel.style.display = "none"; return; }
  const k = 1 / mmPerPx();
  Object.assign(sel.style, { display: "block", left: rect[0] * k + "px", top: rect[1] * k + "px",
    width: (rect[2] - rect[0]) * k + "px", height: (rect[3] - rect[1]) * k + "px" });
}
wrap.addEventListener("pointerdown", ev => { drag = toMm(ev); rect = null; wrap.setPointerCapture(ev.pointerId); update(); });
wrap.addEventListener("pointermove", ev => {
  if (!drag) return;
  const p = toMm(ev);
  rect = [Math.min(drag[0], p[0]), Math.min(drag[1], p[1]), Math.max(drag[0], p[0]), Math.max(drag[1], p[1])];
  update();
});
wrap.addEventListener("pointerup", () => {
  drag = null;
  if (rect && (rect[2] - rect[0] < 2 || rect[3] - rect[1] < 2)) rect = null;   // a click, not a drag
  update();
});

function command() {
  const f = v => v.toFixed(1), q = s => /\s/.test(s) ? `"${s}"` : s;
  let c = `pdf-map-to-stl build ${q(PAGE.pdf)}`;
  if (PAGE.page) c += ` --page ${PAGE.page}`;
  if (rect) c += ` --crop ${rect.map(f).join(",")}`;
  c += ` --width ${document.getElementById("width").value}`;
  return c;
}
function update() {
  drawSel();
  const f = v => v.toFixed(1);
  const w = rect ? rect[2] - rect[0] : PAGE.width_mm, h = rect ? rect[3] - rect[1] : PAGE.height_mm;
  document.getElementById("crop").textContent = rect
    ? `--crop ${rect.map(f).join(",")}\n(${f(w)} × ${f(h)} mm on the map page)` : "Whole page";
  const width = Number(document.getElementById("width").value);
  document.getElementById("scale").textContent =
    `Model ${width} × ${f(h * width / w)} mm, ×${(width / w).toFixed(2)} the printed map.`;
  document.getElementById("cmd").textContent = command();
}
document.getElementById("width").addEventListener("input", update);
document.getElementById("zin").addEventListener("click", () => { zoom = Math.min(8, zoom * 1.5); layout(); });
document.getElementById("zout").addEventListener("click", () => { zoom = Math.max(0.25, zoom / 1.5); layout(); });
document.getElementById("clear").addEventListener("click", () => { rect = null; update(); });
document.getElementById("copy").addEventListener("click", () => navigator.clipboard?.writeText(command()));
window.addEventListener("resize", layout);
img.addEventListener("load", () => { layout(); update(); });
</script>
</body>
</html>
