<!doctype html>
<!--
  Model tuner for pdf-map-to-stl. Generated by tuner.py: the model data is injected
  where MODEL_DATA appears below. Edit this template, not the generated tuner.html.

  Accessibility: the form (first script) works on its own, with keyboard and screen
  reader, even when the 3D view (second script, needs WebGL and internet) cannot load.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Tuner</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --text: #1d1d1b; --muted: #55554f; --line: #d6d6cf;
    --accent: #1a5fb4; --accent-text: #ffffff; --warn: #8a4b00; --ok: #26662b; --field: #ffffff;
    --view-bg: #eeeeea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1e; --text: #f0f0ec; --muted: #c2c2bb; --line: #3d3d3a;
      --accent: #8ab4f8; --accent-text: #10131a; --warn: #f2b45c; --ok: #8fd694; --field: #2a2a28;
      --view-bg: #2a2a28;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-text);
    padding: 8px 12px; border-radius: 6px; z-index: 10; }
  .skip:focus { left: 8px; }
  .visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #app { display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 100vh; }
  #view { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--view-bg); }
  #canvasBox { flex: 1; min-height: 0; position: relative; }
  #canvasBox canvas { display: block; width: 100%; height: 100%; }
  #noView { padding: 24px; color: var(--muted); }
  #viewControls { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border-top: 1px solid var(--line); background: var(--panel); }
  #hud { padding: 4px 8px; font-size: 14px; color: var(--muted); background: var(--panel); margin: 0; font-variant-numeric: tabular-nums; }
  main { background: var(--panel); border-left: 1px solid var(--line); padding: 16px 20px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 24px 0 8px; }
  .sub, .hint { color: var(--muted); font-size: 14px; }
  .sub { word-break: break-word; }
  fieldset.layer { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px; padding: 6px 10px 8px; }
  fieldset.layer.off { border-style: dashed; }
  fieldset.layer legend { padding: 0 4px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(0,0,0,.35); flex: none; }
  .fields { display: grid; grid-template-columns: auto 80px 1fr; gap: 6px 8px; align-items: center; }
  .fields .meta, .fields .wide { grid-column: 1 / -1; }
  .fields .meta { color: var(--muted); font-size: 14px; }
  .fields .wide { font-size: 14px; }
  .fields select { grid-column: 2 / -1; }
  input[type=number] { width: 80px; font: inherit; padding: 2px 4px; background: var(--field); color: var(--text);
    border: 1px solid var(--muted); border-radius: 4px; }
  select { font: inherit; font-size: 14px; padding: 2px 4px; background: var(--field); color: var(--text);
    border: 1px solid var(--muted); border-radius: 4px; max-width: 100%; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  .switches { display: grid; gap: 4px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--muted);
    background: var(--field); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  caption { text-align: left; color: var(--muted); padding-bottom: 4px; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    white-space: pre-wrap; word-break: break-all; font-size: 13px; margin: 6px 0 0; }
  .warn { color: var(--warn); }
  .ok { color: var(--ok); }
  .tile { display: grid; grid-template-columns: repeat(2, auto 80px); gap: 6px 8px; align-items: center; justify-content: start; }
  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; }
    #view { position: static; height: 60vh; }
    main { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<a class="skip" href="#controls" data-t="skip"></a>
<div id="app">
  <section id="view" aria-labelledby="viewTitle">
    <h2 id="viewTitle" class="visually-hidden" data-t="view_title"></h2>
    <div id="canvasBox">
      <p id="noView" hidden data-t="no_view"></p>
    </div>
    <div id="viewControls" role="group" data-t-aria="move_view">
      <button type="button" data-view="left" data-t="rotate_left"></button>
      <button type="button" data-view="right" data-t="rotate_right"></button>
      <button type="button" data-view="up" data-t="tilt_up"></button>
      <button type="button" data-view="down" data-t="tilt_down"></button>
      <button type="button" data-view="in" data-t="zoom_in"></button>
      <button type="button" data-view="out" data-t="zoom_out"></button>
      <button type="button" data-view="reset" data-t="reset_view"></button>
    </div>
    <p id="hud" aria-hidden="true" data-t="hud"></p>
  </section>

  <main id="controls" tabindex="-1">
    <h1 data-t="heading"></h1>
    <p class="sub" id="source"></p>
    <p class="hint" data-t="intro"></p>

    <h2 data-t="features"></h2>
    <div class="switches" role="group" data-t-aria="features_aria">
      <label><input type="checkbox" id="fTextures"> <span data-t="f_textures"></span></label>
      <label><input type="checkbox" id="fSymbols"> <span data-t="f_symbols"></span></label>
    </div>

    <h2 id="baseTitle" data-t="base_title"></h2>
    <div id="base"></div>

    <h2 data-t="ground"></h2>
    <div id="terrain"></div>

    <h2 data-t="objects"></h2>
    <div id="objects"></div>

    <h2 data-t="rebuild_title"></h2>
    <div id="rebuild" role="status" aria-live="polite"></div>

    <h2 data-t="height_check"></h2>
    <div id="stepStatus" role="status" aria-live="polite"></div>

    <h2 data-t="summary_title"></h2>
    <table>
      <caption id="summaryCaption"></caption>
      <thead><tr><th scope="col" data-t="col_layer"></th><th scope="col" data-t="col_kind"></th>
        <th scope="col" class="num" data-t="col_height"></th><th scope="col" data-t="col_look"></th>
        <th scope="col" class="num" data-t="col_area"></th></tr></thead>
      <tbody id="summary"></tbody>
    </table>

    <h2 data-t="check_title"></h2>
    <ul id="checks"></ul>

    <h2 data-t="save_title"></h2>
    <div class="buttons">
      <button type="button" class="primary" id="download" data-t="download"></button>
      <button type="button" id="copy" data-t="copy"></button>
      <button type="button" id="reset" data-t="reset"></button>
    </div>
    <p id="saveStatus" role="status" aria-live="polite" class="hint"></p>
    <p class="hint" data-t="put_settings"></p>
    <pre id="cmd"></pre>
    <details><summary data-t="show_toml"></summary><pre id="toml"></pre></details>

    <h2 id="tileTitle" data-t="tile_title"></h2>
    <p class="hint" data-t="tile_hint"></p>
    <form id="tileForm" class="tile" aria-labelledby="tileTitle">
      <label for="tileX0" data-t="left"></label><input id="tileX0" type="number" step="0.5" min="0">
      <label for="tileY0" data-t="bottom"></label><input id="tileY0" type="number" step="0.5" min="0">
      <label for="tileX1" data-t="right"></label><input id="tileX1" type="number" step="0.5" min="0">
      <label for="tileY1" data-t="top"></label><input id="tileY1" type="number" step="0.5" min="0">
    </form>
    <div class="buttons">
      <button type="button" id="tileMake" data-t="tile_make"></button>
      <button type="button" id="pick" data-t="tile_pick"></button>
      <button type="button" id="clearTile" data-t="tile_clear"></button>
    </div>
    <p id="tileStatus" role="status" aria-live="polite" class="hint"></p>
    <pre id="tileCmd" data-t="no_tile"></pre>

    <h2 data-t="view_options"></h2>
    <div class="fields">
      <label for="exagNum" data-t="exaggeration"></label>
      <input id="exagNum" type="number" min="1" max="6" step="0.5" value="1">
      <input id="exag" type="range" min="1" max="6" step="0.5" value="1" data-t-aria="exaggeration_aria">
    </div>
  </main>
</div>

<script>
// ============================================================== form (no dependencies)
const MODEL = /*__MODEL_DATA__*/null;
// Texts in the page's language (locales/<lang>.toml, section [tuner]).
const T = (key, values = {}) => (MODEL.text[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => values[k] ?? "");
document.documentElement.lang = MODEL.lang;
document.title = T("page_title");
document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = T(el.dataset.t); });
document.querySelectorAll("[data-t-aria]").forEach(el => el.setAttribute("aria-label", T(el.dataset.tAria)));
const MIN_FLOOR = 0.4;          // a recess always leaves this much plate below it (as in model3d.py)
const SHAPES = { as_drawn: T("shape_as_drawn"), dot: T("shape_dot"), ring: T("shape_ring"), cross: T("shape_cross") };
const $ = id => document.getElementById(id);
const fmt = v => (Math.round(v * 10) / 10).toString();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const CLASSES = MODEL.classes;
const BY_NAME = Object.fromEntries(CLASSES.map(c => [c.class, c]));
const TEXTURES = MODEL.layers.filter(l => l.role === "texture");
const FIXED_ROLES = ["braille", "north", "frame", "edge", "pin", "scale_bar", "qr", "qr_frame"];  // fixed size: not tuned here
const FIXED = MODEL.layers.filter(l => FIXED_ROLES.includes(l.role));
const TEXTURE_TEXT = Object.fromEntries(MODEL.texture_library.map(t => [t.name, t.text]));
const initial = {
  base: MODEL.base_mm,
  features: { ...MODEL.features },
  classes: Object.fromEntries(CLASSES.map(c => [c.class,
    { enabled: c.enabled, height: c.height_mm, texture: c.texture, shape: c.shape }])),
};
// Saved values belong to the build they started from: after a rebuild with other values,
// old browser-saved values must not silently override the new ones.
const STORE_KEY = "pdf-map-to-stl:tuner:" + MODEL.pdf + ":" + JSON.stringify(initial);
let state = structuredClone(initial);
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY));
  if (saved && saved.classes) state = saved;
} catch (e) { /* storage unavailable: start from the build's values */ }
const visible = {};
window.tunerState = () => viewState();

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function view(fn, ...args) { if (window.view3d) window.view3d[fn](...args); }

const isOn = name => state.classes[name].enabled;
const textureOf = name => state.features.textures ? state.classes[name].texture : "none";
const textureText = name => {
  const t = textureOf(name);
  return t === "none" ? T("smooth") : t === "custom" ? BY_NAME[name].texture_text : (TEXTURE_TEXT[t] || t);
};
const shapeOf = name => state.features.standard_symbols || !BY_NAME[name].point_symbol ? state.classes[name].shape : "as_drawn";

// Heights and visibility of every mesh in the 3D view, as the next build would make them
// (as far as the view can tell without rebuilding).
function viewState() {
  const heights = {}, hidden = {};
  for (const c of CLASSES) {
    let h = state.classes[c.class].height;
    if (!isOn(c.class)) {
      if (c.role === "object") hidden[c.class] = true;
      else if (c.merge_into && state.classes[c.merge_into]) h = state.classes[c.merge_into].height;
    }
    heights[c.class] = h;
    if (visible[c.class] === false) hidden[c.class] = true;
  }
  for (const t of TEXTURES) {
    if (hidden[t.on] || textureOf(t.on) === "none") hidden[t.class] = true;
  }
  return { base: state.base, heights, hidden };
}

function feel(name) {
  const c = BY_NAME[name], h = state.classes[name].height;
  if (c.role === "object") return T("high", { h: fmt(h) });
  if (h < 0) return T("recessed", { h: fmt(-h) });
  if (h === 0) return T("flat");
  return T("raised", { h: fmt(h) });
}

// The surface of an area: with heights that include the texture (output.heights_include_texture),
// one texture thickness under the class height, as model3d.texture_levels makes it.
const TEX_THICK = Object.fromEntries(TEXTURES.map(t => [t.on, t.height_mm - t.z0_mm]));
function areaHeight(cls, v) {
  const h = v.heights[cls], th = TEX_THICK[cls];
  if (!MODEL.heights_include_texture || !th || v.hidden[cls + " texture"]) return h;
  return h >= 0 ? Math.max(h - Math.min(th, h), 0) : h - th;
}

// ---------------------------------------------------------------- one labelled group per layer
const setters = {};
function heightFields(key, label, value, min, max, onChange) {
  const id = "h-" + key.replace(/\W/g, "_");
  const html = `
      <label for="${id}">${T("height_mm")}</label>
      <input id="${id}" type="number" step="0.1" min="${min}" max="${max}" value="${value}" aria-describedby="${id}-meta">
      <input id="${id}-range" type="range" step="0.1" min="${min}" max="${max}" value="${value}"
        aria-label="${esc(T("height_slider", { label }))}" aria-describedby="${id}-meta">`;
  const wire = fs => {
    const num = fs.querySelector(`#${id}`), rng = fs.querySelector(`#${id}-range`);
    const set = (v, quiet) => {
      v = Math.min(max, Math.max(min, Math.round(Number(v) * 10) / 10));
      if (Number.isNaN(v)) return;
      num.value = v; rng.value = v; rng.setAttribute("aria-valuetext", T("millimetres", { v: fmt(v) }));
      onChange(v, quiet);
    };
    num.addEventListener("change", () => set(num.value));
    rng.addEventListener("input", () => set(rng.value));
    return set;
  };
  return { id, html, wire };
}

function baseRow() {
  const fs = document.createElement("fieldset");
  fs.className = "layer";
  const hf = heightFields("__base", T("base_title"), state.base, 0.6, 6, (v, quiet) => { state.base = v; changed(quiet); });
  fs.innerHTML = `<legend>${T("base_title")}</legend><div class="fields">${hf.html}
    <span class="meta" id="${hf.id}-meta">${T("base_meta")}</span></div>`;
  $("base").appendChild(fs);
  setters.__base = hf.wire(fs);
  setters.__base(state.base, true);
}

function classRow(c) {
  const key = c.class.replace(/\W/g, "_");
  const fs = document.createElement("fieldset");
  fs.className = "layer";
  const hf = heightFields(c.class, c.label, state.classes[c.class].height, c.role === "object" ? 0 : -2, 6,
    (v, quiet) => { state.classes[c.class].height = v; changed(quiet); });
  const offNote = c.role === "object" ? T("off_object")
    : c.merge_into ? esc(T("off_merge", { label: c.merge_label })) : T("off_under");
  let extra = "";
  if (c.role === "terrain") {
    const opts = [["none", T("none_smooth")], ...MODEL.texture_library.map(t => [t.name, `${t.name}: ${t.text}`])];
    if (c.texture === "custom") opts.push(["custom", T("as_config", { text: c.texture_text })]);
    extra = `<label for="tx-${key}">${T("texture")}</label>
      <select id="tx-${key}">${opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("")}</select>`;
  } else {
    extra = `<label for="sh-${key}">${T("shape")}</label>
      <select id="sh-${key}">${Object.entries(SHAPES).map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>`;
  }
  const meta = (c.role === "object" ? T("meta_object", { w: fmt(c.min_width_mm) }) : T("meta_ground"))
    + (c.on_model ? T("meta_covers", { a: fmt(c.area_mm2) }) : T("meta_not_on")) + " " + offNote;
  fs.innerHTML = `
    <legend><span class="sw" style="background:${c.colour}" aria-hidden="true"></span>${esc(c.label)}</legend>
    <div class="fields">
      <label class="wide"><input type="checkbox" id="on-${key}"> ${esc(T("show_on_model", { label: c.label }))}</label>
      ${hf.html}
      ${extra}
      <span class="meta" id="${hf.id}-meta">${meta}</span>
      ${c.on_model ? `<label class="wide"><input type="checkbox" id="vis-${key}" checked> ${T("show_in_view")}</label>` : ""}
    </div>`;
  $(c.role === "object" ? "objects" : "terrain").appendChild(fs);
  setters[c.class] = hf.wire(fs);
  const on = fs.querySelector(`#on-${key}`);
  const syncOn = () => { fs.classList.toggle("off", !state.classes[c.class].enabled); };
  on.checked = state.classes[c.class].enabled; syncOn();
  on.addEventListener("change", () => { state.classes[c.class].enabled = on.checked; syncOn(); changed(); });
  const sel = fs.querySelector(c.role === "terrain" ? `#tx-${key}` : `#sh-${key}`);
  const field = c.role === "terrain" ? "texture" : "shape";
  sel.value = state.classes[c.class][field];
  sel.addEventListener("change", () => { state.classes[c.class][field] = sel.value; changed(); });
  const vis = fs.querySelector(`#vis-${key}`);
  if (vis) vis.addEventListener("change", () => { visible[c.class] = vis.checked; view("apply", viewState()); });
  setters[c.class](state.classes[c.class].height, true);
  return { on, sel };
}

const rows = {};
function buildForm() {
  $("source").textContent = T("source", { pdf: MODEL.pdf, w: fmt(MODEL.width_mm), h: fmt(MODEL.height_mm), config: MODEL.config })
    + (MODEL.title ? T("source_title", { title: MODEL.title }) : "");
  for (const [id, k] of [["fTextures", "textures"], ["fSymbols", "standard_symbols"]]) {
    $(id).checked = state.features[k];
    $(id).addEventListener("change", e => { state.features[k] = e.target.checked; changed(); });
  }
  baseRow();
  const ordered = [...CLASSES].sort((a, b) => (b.on_model - a.on_model) || (a.height_mm - b.height_mm));
  for (const c of ordered) rows[c.class] = classRow(c);
  const checks = $("checks");
  for (const line of MODEL.check_lines) {
    const li = document.createElement("li"); li.textContent = line.replace(/^\s*-\s*/, ""); checks.appendChild(li);
  }
  if (MODEL.check_ok) { const li = document.createElement("li"); li.className = "ok"; li.textContent = T("all_passed"); checks.prepend(li); }
}

// ---------------------------------------------------------------- outputs that follow the values
function totalHeight() {
  const v = viewState();
  let top = 0;
  for (const c of CLASSES) if (isOn(c.class)) top = Math.max(top, v.heights[c.class]);
  for (const t of TEXTURES) if (!v.hidden[t.class])
    top = Math.max(top, MODEL.heights_include_texture ? v.heights[t.on] : Math.max(v.heights[t.on], 0) + (t.height_mm - t.z0_mm));
  for (const f of FIXED) top = Math.max(top, f.height_mm);
  return state.base + top;
}

function summary() {
  const body = $("summary");
  body.innerHTML = "";
  const shown = CLASSES.filter(c => isOn(c.class));
  for (const c of shown.sort((a, b) => state.classes[a.class].height - state.classes[b.class].height)) {
    const tr = document.createElement("tr");
    const look = c.role === "object" ? SHAPES[shapeOf(c.class)] : textureText(c.class);
    const cells = [c.label, c.role === "object" ? T("kind_object") : T("kind_ground"), feel(c.class), look,
      c.on_model ? fmt(c.area_mm2) : T("after_build")];
    cells.forEach((v, i) => {
      const td = document.createElement(i === 0 ? "th" : "td");
      if (i === 0) td.scope = "row";
      if (i === 2 || i === 4) td.className = "num";
      td.textContent = v; tr.appendChild(td);
    });
    body.appendChild(tr);
  }
  $("summaryCaption").textContent = T("caption", { base: fmt(state.base), top: fmt(totalHeight()) });
}

function stepProblems() {
  // Ground layers whose heights differ by less than the minimum step and that have the same
  // texture may feel the same where they touch (the build's tactile check knows which touch).
  const ground = CLASSES.filter(c => c.role === "terrain" && isOn(c.class));
  const out = [];
  for (let i = 0; i < ground.length; i++) for (let j = i + 1; j < ground.length; j++) {
    const a = ground[i].class, b = ground[j].class;
    const d = Math.abs(state.classes[a].height - state.classes[b].height);
    if (d < MODEL.min_step_mm && textureText(a) === textureText(b))
      out.push(T("step_item", { a: BY_NAME[a].label, b: BY_NAME[b].label, d: fmt(d), texture: textureText(a) }));
  }
  return out;
}

function rebuildList() {
  const out = [];
  for (const [k, text] of [["textures", T("feature_textures")], ["standard_symbols", T("feature_symbols")]])
    if (state.features[k] !== initial.features[k]) out.push(`${text} ${state.features[k] ? T("on") : T("off")}`);
  for (const c of CLASSES) {
    const s = state.classes[c.class], i = initial.classes[c.class];
    if (s.enabled !== i.enabled && (c.role === "terrain" || !c.on_model)) out.push(`${c.label} ${s.enabled ? T("on") : T("off")}`);
    if (s.texture !== i.texture) out.push(T("change_texture", { label: c.label, value: s.texture }));
    if (s.shape !== i.shape) out.push(T("change_shape", { label: c.label, value: SHAPES[s.shape] }));
  }
  return out;
}

let announceTimer = null;
function changed(quiet) {
  save();
  summary();
  $("toml").textContent = toml();
  $("cmd").textContent = MODEL.command;
  view("apply", viewState());
  const r = rebuildList();
  $("rebuild").innerHTML = r.length
    ? `<p class="warn">${esc(T("rebuild_warn", { list: r.join("; ") }))}</p>`
    : `<p class="hint">${T("rebuild_none")}</p>`;
  clearTimeout(announceTimer);
  // Wait until the user stops changing values, so the screen reader is not flooded.
  announceTimer = setTimeout(() => {
    const p = stepProblems();
    $("stepStatus").innerHTML = p.length
      ? `<p class="warn">${esc(T("step_warn", { mm: MODEL.min_step_mm, list: p.join("; ") }))}</p>`
      : `<p class="ok">${T("step_ok", { mm: MODEL.min_step_mm })}</p>`;
  }, quiet ? 0 : 700);
}

function toml() {
  const lines = [T("toml_header", { pdf: MODEL.pdf }), T("toml_apply", { command: MODEL.command }), "",
    "[output]", `base_mm = ${state.base}`, "", "[features]",
    `textures = ${state.features.textures}`, `standard_symbols = ${state.features.standard_symbols}`];
  for (const c of CLASSES) {
    const s = state.classes[c.class];
    lines.push("", `[class.${c.class}]`, `enabled = ${s.enabled}`, `height_mm = ${s.height}`);
    if (c.role === "terrain" && s.texture !== "custom") lines.push(`texture = "${s.texture}"`);
    if (c.role === "object") lines.push(`shape = "${s.shape}"`);
  }
  return lines.join("\n") + "\n";
}

// ---------------------------------------------------------------- save
$("download").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([toml()], { type: "text/plain" }));
  a.download = "settings.toml"; a.click(); URL.revokeObjectURL(a.href);
  $("saveStatus").textContent = T("downloaded");
});
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(toml()); $("saveStatus").textContent = T("copied"); }
  catch (e) { $("saveStatus").textContent = T("copy_failed"); }
});
$("reset").addEventListener("click", () => {
  state = structuredClone(initial);
  setters.__base(initial.base, true);
  $("fTextures").checked = state.features.textures; $("fSymbols").checked = state.features.standard_symbols;
  for (const c of CLASSES) {
    setters[c.class](initial.classes[c.class].height, true);
    rows[c.class].on.checked = initial.classes[c.class].enabled;
    rows[c.class].on.closest("fieldset").classList.toggle("off", !initial.classes[c.class].enabled);
    rows[c.class].sel.value = initial.classes[c.class][c.role === "terrain" ? "texture" : "shape"];
  }
  changed(true);
  $("saveStatus").textContent = T("reset_done");
});

// ---------------------------------------------------------------- test tile
const mapW = MODEL.map_box[2] - MODEL.map_box[0], mapH = MODEL.map_box[3] - MODEL.map_box[1];
for (const id of ["tileX0", "tileX1"]) $(id).max = fmt(mapW);
for (const id of ["tileY0", "tileY1"]) $(id).max = fmt(mapH);
function makeTile() {
  const v = ["tileX0", "tileY0", "tileX1", "tileY1"].map(id => Number($(id).value));
  if (v.some(Number.isNaN) || $("tileX0").value === "" || $("tileY1").value === "") {
    $("tileStatus").textContent = T("fill_all"); return;
  }
  const [x0, x1] = [v[0], v[2]].sort((a, b) => a - b), [y0, y1] = [v[1], v[3]].sort((a, b) => a - b);
  const c = [Math.max(0, x0), Math.max(0, y0), Math.min(mapW, x1), Math.min(mapH, y1)];
  if (c[2] - c[0] < 5 || c[3] - c[1] < 5) { $("tileStatus").textContent = T("tile_min"); return; }
  const base = MODEL.command.replace(/ -o \S+$|-o "[^"]*"$/, "").trim();
  $("tileCmd").textContent = `${base} --region ${c.map(fmt).join(",")} -o outputs\\tile`;
  $("tileStatus").textContent = T("tile_made", { w: fmt(c[2] - c[0]), h: fmt(c[3] - c[1]) });
  view("showTile", c);
}
$("tileMake").addEventListener("click", makeTile);
$("tileForm").addEventListener("submit", e => { e.preventDefault(); makeTile(); });
$("clearTile").addEventListener("click", () => {
  for (const id of ["tileX0", "tileY0", "tileX1", "tileY1"]) $(id).value = "";
  $("tileCmd").textContent = T("no_tile"); $("tileStatus").textContent = T("tile_cleared"); view("showTile", null);
});
let corners = [];
window.tilePicking = false;
$("pick").addEventListener("click", () => {
  window.tilePicking = true; corners = [];
  $("tileStatus").textContent = window.view3d ? T("first_corner") : T("no_3d");
});
window.onTileCorner = (x, y) => {          // called by the 3D view, in map mm
  corners.push([x, y]);
  if (corners.length < 2) { $("tileStatus").textContent = T("opposite_corner"); return; }
  window.tilePicking = false;
  $("tileX0").value = fmt(Math.min(corners[0][0], corners[1][0])); $("tileX1").value = fmt(Math.max(corners[0][0], corners[1][0]));
  $("tileY0").value = fmt(Math.min(corners[0][1], corners[1][1])); $("tileY1").value = fmt(Math.max(corners[0][1], corners[1][1]));
  makeTile();
};

// ---------------------------------------------------------------- view options
function setExag(v) { $("exag").value = v; $("exagNum").value = v; view("setExaggeration", Number(v)); }
$("exag").addEventListener("input", e => setExag(e.target.value));
$("exagNum").addEventListener("change", e => setExag(e.target.value));
document.querySelectorAll("#viewControls button").forEach(b => b.addEventListener("click", () => view("move", b.dataset.view)));

buildForm();
changed(true);
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
// ============================================================== 3D view (optional)
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const box = document.getElementById("canvasBox");
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { document.getElementById("noView").hidden = false; throw e; }
renderer.setPixelRatio(window.devicePixelRatio);
renderer.domElement.setAttribute("role", "img");
renderer.domElement.setAttribute("tabindex", "0");
renderer.domElement.setAttribute("aria-label",
  "3D view of the model. Arrow keys rotate and tilt, plus and minus zoom. The model summary table has the same information as text.");
box.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--view-bg").trim() || "#eeeeea");
const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 5000);
camera.up.set(0, 0, 1);
const W = MODEL.width_mm, H = MODEL.height_mm, cx = W / 2, cy = H / 2;
const home = new THREE.Vector3(cx - W * 0.2, cy - H * 1.3, W * 0.9);
camera.position.copy(home);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(cx, cy, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x888880, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-60, 80, 120);
scene.add(sun);

const v2 = ([x, y]) => new THREE.Vector2(x, y);
function shapesOf(polys) {
  return polys.map(rings => {
    const s = new THREE.Shape(rings[0].map(v2));
    for (const hole of rings.slice(1)) s.holes.push(new THREE.Path(hole.map(v2)));
    return s;
  });
}
// Every layer is extruded once at depth 1 and then scaled in z, so changes are instant.
const unitGeom = shapes => new THREE.ExtrudeGeometry(shapes, { depth: 1, bevelEnabled: false, curveSegments: 4 });
const meshes = {};
for (const l of MODEL.layers) {
  const mat = new THREE.MeshStandardMaterial({ color: l.colour, roughness: 0.85, flatShading: true });
  meshes[l.class] = new THREE.Mesh(unitGeom(shapesOf(l.polygons)), mat);
  scene.add(meshes[l.class]);
}
const plateMat = new THREE.MeshStandardMaterial({ color: 0xcfcfc8, roughness: 0.9 });
let plate = null, plateKey = "";
const tileBox = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xd0021b }));
scene.add(tileBox);
let exag = 1, last = null;

function rebuildPlate(v) {
  // The plate gets holes where a layer is recessed; the recessed layer is the floor of the hole.
  const recessed = MODEL.layers.filter(l => l.role === "terrain" && v.heights[l.class] < 0);
  const key = recessed.map(l => l.class).join();
  if (plate && key === plateKey) return;
  plateKey = key;
  if (plate) { scene.remove(plate); plate.geometry.dispose(); }
  const outline = new THREE.Shape(MODEL.plate[0].map(v2));
  for (const l of recessed) for (const rings of l.polygons) outline.holes.push(new THREE.Path(rings[0].map(v2)));
  plate = new THREE.Mesh(unitGeom([outline]), plateMat);
  scene.add(plate);
}

function apply(v) {                        // v = { base, heights: {class: mm}, hidden: {layer: true} }
  last = v;
  rebuildPlate(v);
  const base = v.base;
  plate.scale.z = base * exag;
  for (const l of MODEL.layers) {
    const m = meshes[l.class];
    m.visible = !v.hidden[l.class];
    if (FIXED_ROLES.includes(l.role)) {
      m.position.z = base * exag; m.scale.z = l.height_mm * exag; continue;
    }
    if (l.role === "texture") {
      // On top of its class; on the floor of a recessed class (water waves).
      const a = areaHeight(l.on, v);
      const z = a >= 0 ? a : -Math.min(-a, base - MIN_FLOOR);
      const thick = MODEL.heights_include_texture && v.heights[l.on] >= 0
        ? Math.min(l.height_mm - l.z0_mm, v.heights[l.on]) : l.height_mm - l.z0_mm;
      m.position.z = (base + z) * exag; m.scale.z = Math.max(thick, 0.001) * exag;
      continue;
    }
    const h = areaHeight(l.class, v);
    if (h >= 0) { m.position.z = base * exag; m.scale.z = Math.max(h, 0.02) * exag; }
    else { const d = Math.min(-h, base - MIN_FLOOR); m.position.z = 0; m.scale.z = (base - d) * exag; }
  }
  tileBox.position.z = (base + 6) * exag;
}

function move(what) {
  const off = camera.position.clone().sub(controls.target);
  let r = off.length(), az = Math.atan2(off.y, off.x), el = Math.asin(off.z / r);
  if (what === "left") az -= Math.PI / 12;
  if (what === "right") az += Math.PI / 12;
  if (what === "up") el = Math.min(1.55, el + 0.15);
  if (what === "down") el = Math.max(0.1, el - 0.15);
  if (what === "in") r *= 0.8;
  if (what === "out") r *= 1.25;
  if (what === "reset") { camera.position.copy(home); controls.target.set(cx, cy, 0); controls.update(); return; }
  camera.position.set(controls.target.x + r * Math.cos(el) * Math.cos(az),
                      controls.target.y + r * Math.cos(el) * Math.sin(az), controls.target.z + r * Math.sin(el));
  controls.update();
}
renderer.domElement.addEventListener("keydown", e => {
  const k = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", "+": "in", "=": "in", "-": "out", "0": "reset" }[e.key];
  if (k) { e.preventDefault(); move(k); }
});

function showTile(c) {
  if (!c) { tileBox.geometry.setFromPoints([]); return; }
  const oy = MODEL.map_box[1];
  const [x0, y0, x1, y1] = [c[0], c[1] + oy, c[2], c[3] + oy];
  tileBox.geometry.setFromPoints([[x0, y0], [x1, y0], [x1, y0], [x1, y1], [x1, y1], [x0, y1], [x0, y1], [x0, y0]]
    .map(([x, y]) => new THREE.Vector3(x, y, 0)));
}

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function modelPoint(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects([plate, ...Object.values(meshes)])[0];
  return hit ? hit.point : null;
}
const toMap = p => [Math.max(0, Math.min(MODEL.map_box[2], p.x)), Math.max(0, Math.min(MODEL.map_box[3] - MODEL.map_box[1], p.y - MODEL.map_box[1]))];
renderer.domElement.addEventListener("pointermove", ev => {
  const p = modelPoint(ev);
  if (p) { const [x, y] = toMap(p); document.getElementById("hud").textContent = T("hud_position", { x: x.toFixed(1), y: y.toFixed(1) }); }
});
renderer.domElement.addEventListener("click", ev => {
  if (!window.tilePicking) return;
  const p = modelPoint(ev);
  if (p) window.onTileCorner(...toMap(p));
});

function resize() {
  const w = box.clientWidth, h = box.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
window.view3d = {
  apply, move, showTile,
  setExaggeration: v => { exag = v; if (last) apply(last); },
};
apply(window.tunerState());
resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
<script>
// Without internet, three.js cannot load and the 3D view script above never runs: say so.
window.addEventListener("load", () => setTimeout(() => {
  if (!window.view3d) document.getElementById("noView").hidden = false;
}, 3000));
</script>
</body>
