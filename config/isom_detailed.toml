# pdf-map-to-stl configuration: detailed ISOM / ISSprOM classes (more classes than the
# tactile guidebook set in default.toml). Use with -c config/isom_detailed.toml.
#
# [[symbol]] rules recognise PDF paint operations; the first matching rule wins.
# [class.*] says what each recognised class becomes in the tactile model.
# All sizes are millimetres: on the PDF page for symbol rules, on the printed model
# for [output] and [class.*].
#
# The symbol rules below are calibrated on samples/sample.pdf (a sprint map exported
# from OCAD). Symbol codes follow ISOM 2000 / ISSprOM; codes marked "?" are guesses
# that still need checking against the map legend.

[output]
width_mm = 120.0          # printed model width; the crop is scaled to this
base_mm = 2.0             # base plate thickness
orientation_corner_mm = 8.0  # the top-right corner is cut off so the reader finds "up"; 0 = no cut
title = "auto"            # Braille title at the top left: "auto" = map file name, "" = none
map_scale = 0             # map scale denominator (e.g. 4000) for the text description; 0 = unknown

# Generalisation, smoothing and features keep their defaults (see config/default.toml
# and docs/SETTINGS.md); add [generalize], [smoothing] or [features] here to change them.

# ---------------------------------------------------------------- tactile rules
# Thresholds for the tactile check (tactile_check.png, description.txt). Starting values
# from common tactile-graphics practice; confirm them with the people who read the maps.
[tactile]
min_feature_mm = 1.0      # raised parts narrower than this are hard to feel
min_gap_mm = 3.0          # raised parts closer than this feel like one
min_height_step_mm = 0.5  # height differences smaller than this are hard to notice
min_symbol_area_mm2 = 9.0 # isolated areas smaller than this are hard to identify

# ---------------------------------------------------------------- Braille
# Physical size of Braille dots; never scaled with the map.
[braille]
dot_diameter_mm = 1.5
dot_height_mm = 0.6
dot_spacing_mm = 2.5
cell_spacing_mm = 6.0
line_spacing_mm = 10.0

# ---------------------------------------------------------------- tactile classes
# role: "terrain" = area classes that tile the map; what is visible after paint order.
#       "object"  = raised features placed on top (walls, hedges, trees); built from
#                   their own outline, never cut by what is painted above them.
#       "ignore"  = not part of the tactile model (course, contours, grid lines).
# height_mm: top of the feature above the base plate. Negative = recessed into it.
# min_width_mm (objects): lines are widened to at least this on the model.
# label: Braille label in the legend (short; no accents).
# texture: raised pattern on top of the area, so classes at the same height can still
#   be told apart: { kind = "dots" | "lines", pitch_mm, size_mm, height_mm, angle_deg }.
#
# Default design: levels 0.5 mm apart, and every class sharing a level has its own
# texture. Walkable surfaces are low, things you cannot cross are high.

[class.paved]                       # level 0: smooth
role = "terrain"
height_mm = 0.0
label = "paved"
[class.paved_alt]                   # level 0: ridges
role = "terrain"
height_mm = 0.0
label = "paved 2"
texture = { kind = "lines", pitch_mm = 3.0, size_mm = 1.0, height_mm = 0.5, angle_deg = 45 }
[class.canopy]                      # level 0: dots
role = "terrain"
height_mm = 0.0
label = "canopy"
texture = { kind = "dots", pitch_mm = 4.0, size_mm = 1.5, height_mm = 0.5 }
[class.open_land]                   # level 0.5: smooth
role = "terrain"
height_mm = 0.5
label = "open"
[class.open_land_scattered_trees]   # level 0.5: dots
role = "terrain"
height_mm = 0.5
label = "open trees"
texture = { kind = "dots", pitch_mm = 3.0, size_mm = 1.2, height_mm = 0.5 }
[class.rough_open]                  # level 0.5: ridges
role = "terrain"
height_mm = 0.5
label = "rough open"
texture = { kind = "lines", pitch_mm = 3.0, size_mm = 1.0, height_mm = 0.5, angle_deg = 45 }
[class.forest]                      # level 1.0
role = "terrain"
height_mm = 1.0
label = "forest"
[class.vegetation_slow]             # level 1.5: smooth
role = "terrain"
height_mm = 1.5
label = "slow green"
[class.vegetation_difficult]        # level 1.5: ridges
role = "terrain"
height_mm = 1.5
label = "hard green"
texture = { kind = "lines", pitch_mm = 3.0, size_mm = 1.0, height_mm = 0.5, angle_deg = 45 }
[class.vegetation_impassable]       # level 2.0
role = "terrain"
height_mm = 2.0
label = "thicket"
[class.out_of_bounds]               # level 2.5: ridges ("do not enter")
role = "terrain"
height_mm = 2.5
label = "no entry"
texture = { kind = "lines", pitch_mm = 3.0, size_mm = 1.0, height_mm = 0.5, angle_deg = -45 }
[class.building]                    # level 3.0
role = "terrain"
height_mm = 3.0
label = "building"
[class.water]                       # recessed
role = "terrain"
height_mm = -0.8
label = "water"

[class.wall]
role = "object"
height_mm = 3.5
min_width_mm = 1.0
label = "wall"
[class.hedge]
role = "object"
height_mm = 2.5
min_width_mm = 1.2
label = "hedge"
[class.tree]
role = "object"
height_mm = 2.0
min_width_mm = 2.0
label = "tree"
merge_gaps = false        # trees stay separate bumps
[class.vegetation_line]
role = "object"
height_mm = 2.0
min_width_mm = 1.0
label = "green line"

[class.orchard]                     # ISOM 412
role = "terrain"
height_mm = 1.0
label = "orchard"
texture = { kind = "dots", pitch_mm = 4.0, size_mm = 1.5, height_mm = 0.5 }
[class.cultivated_land]             # ISOM 415
role = "terrain"
height_mm = 0.5
label = "cultivated"
texture = { kind = "lines", pitch_mm = 3.0, size_mm = 1.0, height_mm = 0.5, angle_deg = 0 }
[class.man_made_object]
role = "object"
height_mm = 2.5
min_width_mm = 0.9
shape = "cross"
size_mm = 3.5
merge_gaps = false
label = "object"

[class.outline]
role = "ignore"
[class.footpath]
role = "ignore"
[class.dotted_line]
role = "ignore"
[class.black_dots]
role = "ignore"
[class.contour]
role = "ignore"
[class.course]
role = "ignore"
[class.north_line]
role = "ignore"
[class.grey_line]
role = "ignore"
[class.unclassified]
role = "ignore"

# ---------------------------------------------------------------- symbol rules
# kind: "fill" | "stroke" | "dots" | "any". rgb matched within rgb_tol (default 3).
# Optional: min_width_mm / max_width_mm (strokes), min_extent_mm / max_extent_mm
# (bbox of the source path), dot_mm / pitch_mm (dot screens, matched within 15 %).

[[symbol]]
class = "open_land_scattered_trees"
isom = "402"
kind = "dots"
rgb = [254, 191, 80]
dot_mm = 0.615
pitch_mm = 0.70

[[symbol]]
