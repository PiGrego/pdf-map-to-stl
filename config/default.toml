# pdf-map-to-stl configuration: the tactile orienteering symbol set.
#
# The classes follow the draft guidebook "Conversion of ISOM and ISSprOM orienteering
# maps into tactile orienteering maps" (Norwegian Orienteering Federation with Tommaso
# Scalet): a small set of broad categories a visually impaired orienteer can tell apart
# by touch, instead of the full ISOM / ISSprOM symbol set. Symbols with no tactile use
# (canopy, contours, footpaths, course) are merged or dropped; canopy, footpaths and
# contours can be switched on (enabled = true). For a richer set with more classes,
# use config/isom_detailed.toml.
#
# Every value here is a default. Change it for one build without editing this file:
#   --settings FILE_OR_PROFILE   a settings file, or a profile in config/profiles/
#   --set section.key=value      one value, e.g. --set class.canopy.enabled=true
# docs/SETTINGS.md explains every setting. Each build writes settings_used.toml.
#
# [[symbol]] rules recognise PDF paint operations; the first matching rule wins.
# [class.*] says what each recognised class becomes in the tactile model.
# Sizes are millimetres: on the PDF page for symbol rules, on the printed model elsewhere.
# The rules are calibrated on samples/orienteering-map-sample-Navile.pdf (ISSprOM sprint
# map from OCAD, 1:5000).

[output]
width_mm = "auto"         # printed map width in mm; "auto" = the suggested size (see [size])
base_mm = 2.0             # base plate thickness
top_skin_mm = 0.6         # parts export: each area owns this much of the plate under it
north_height_mm = 1.0     # height of the north symbols
window_edge_mm = 1.5      # polygon windows: width of the raised line along the map's edge
window_edge_height_mm = 1.0
orientation_corner_mm = 0 # optional: cut off the top-right corner (0 = no cut)
title = "auto"            # Braille title at the top left: "auto" = map file name, "" = none
map_scale = 0             # scale of the printed map (e.g. 5000); 0 = unknown
read_map_scale = true     # if map_scale is 0, read it from the page ("Scala 1:5000", "1:4000")
legend_max_height_mm = 200 # the legend plate wraps into columns above this height

# ---------------------------------------------------------------- size
# The suggested print size (size.py): the size at which detail_share of the map's
# passages are at least tactile.min_gap_mm wide and its raised parts tactile.min_feature_mm.
# Used when width_mm = "auto"; --width or --scale override it.
[size]
min_mm = 100              # the plate's longer side is at least this
max_mm = 1000             # ...and at most this
detail_share = 0.9        # share of passages and parts that must meet the tactile rules
ignore_below_mm = 0.15    # details narrower than this on the PDF page are drawing artefacts
bed_mm = 256              # printer bed: a larger plate is flagged (print it in tiles)

# ---------------------------------------------------------------- position points
# With --geo X,Y,LATITUDE,LONGITUDE (one or two points), the map shows where it is on
# Earth: tall pins at each point (point 1: one pin, point 2: two pins) and the
# coordinates in Braille in the bottom margin, for the reader's navigation app.
[position]
pin_mm = 3.0              # pin diameter
pin_height_mm = 4.0       # above the plate: higher than anything else
decimals = 5              # decimals of the degrees in Braille (5 = about 1 m)

# ---------------------------------------------------------------- slopes (experimental)
# Off by default. On: every band between two contour lines is raised step_mm above the
# band below it, so hills and slopes can be felt (relief.py). The lowest bands are those
# with water; check the result (description.txt, relief_levels.png).
[relief]
enabled = false
step_mm = 0.4             # height of one contour step on the model
max_levels = 12           # at most this many steps
classes = ["contour"]     # classes whose lines are contours
min_width_mm = 0.2        # thinner lines (dashed form lines) are left out (mm on the page)
close_gaps_mm = 10        # contours interrupted by paths are joined across gaps up to this (page mm)
low = "water"             # the bands with lakes or canals are the lowest

# ---------------------------------------------------------------- features
# What the model contains besides the map's own areas and objects.
[features]
textures = true           # raised patterns on areas; false = every area smooth (texture it in the slicer)
standard_symbols = true   # trees, boulders, crosses as standard tactile symbols; false = as drawn on the map
north_symbol = true       # raised north symbols at the top-right and bottom-left corners
scale_bar = true          # a raised scale bar under the Braille title, with its distance in Braille
legend_frames = true      # raised frame around flat samples (paved) on the legend
window_edge = true        # polygon windows: a raised line along the map's edge (outside it the plate is flat)

# ---------------------------------------------------------------- scale bar
# Under the Braille title (features.scale_bar): a raised bar as long as a round distance
# on the ground (10, 20, 50, 100 m...), a tick at each end and ticks between them, and
# the distance in Braille at its right. It needs the map's scale (read from the page,
# or --map-scale). Sizes in mm on the model.
[scale_bar]
max_length_mm = 80        # the longest round distance up to this long
min_length_mm = 10        # no bar if not even this much fits beside the north symbol
height_mm = 1.0           # how high the bar and its ticks stand above the plate
width_mm = 1.5            # width of the bar and of the ticks
tick_mm = 5.0             # length of the end ticks; the ticks between them are 3/5 as long
min_tick_spacing_mm = 6.0 # ticks between the ends only if they are at least this far apart

# ---------------------------------------------------------------- smoothing
# How outlines are drawn. Sizes are mm on the model, except curve_step_mm (on the PDF).
[smoothing]
line_join = "round"       # corners of redrawn lines (walls, fences): "round", "mitre" or "bevel"
line_cap = "round"        # ends of redrawn lines: "round", "flat" or "square"
arc_segments = 4          # segments per quarter circle wherever the tool rounds a shape
curve_step_mm = 0.035     # chord length when reading curves from the PDF; smaller = smoother, slower
simplify_mm = 0.0         # remove outline detail smaller than this; 0 = exact outlines
round_corners_mm = 0.0    # round sharp corners of areas and objects with this radius; 0 = as drawn

# ---------------------------------------------------------------- generalisation
# Automatic changes that make the map readable by touch (see generalize.py). Switch a
# step off to keep the shapes exactly as drawn; the tactile check then reports more.
[generalize]
clean_slivers = true      # strips narrower than sliver_mm are drawing artefacts: give them to the neighbour
sliver_mm = 0.4
open_passages = true      # widen passages between raised areas to tactile.min_gap_mm
widen_thin = true         # widen raised areas narrower than tactile.min_feature_mm
merge_close_objects = true # merge objects closer than merge_gap_mm (double walls); not classes with merge_gaps = false
merge_gap_mm = 3.0
widen_objects = true      # widen lines and small objects to their class min_width_mm
min_area_mm2 = 0.4        # drop pieces smaller than this (cannot be felt or printed)

# ---------------------------------------------------------------- tactile check
# Thresholds of the tactile check, and the targets of generalisation. Starting values
# from common tactile-graphics practice; confirm them with the people who read the maps.
[tactile]
min_feature_mm = 1.0      # raised parts narrower than this are hard to feel
min_gap_mm = 3.0          # raised parts closer than this feel like one
min_height_step_mm = 0.5  # height differences smaller than this are hard to notice
min_symbol_area_mm2 = 9.0 # isolated areas smaller than this are hard to identify

# ---------------------------------------------------------------- recognition
# The [[symbol]] rules below match exact colours and sizes of the map they were made on.
# These settings let the same rules work on another export of a map. Every symbol they
# affect is marked in symbols.csv and description.txt, and the build prints a warning.
[recognition]
size_scale = "auto"       # sizes in the rules times this; "auto" = measured on the dot screens
colour_match_de = 10.0    # an unknown colour takes the nearest rule colour within this distance (2 = just visible); 0 = off
colour_margin_de = 3.0    # ...only if every other rule colour is at least this much farther
lone_dash_class = "footpath"  # crosses are two strokes in an X: a lone short stroke (a path dash) gets this class

# ---------------------------------------------------------------- comparison with the PDF
# After a build, the class map is compared with the PDF as rendered (validate.py). These
# say when the result is a warning: something is wrong with the input, not the map.
[validate]
min_agreement = 0.99      # warn when the model agrees with the PDF on less of the checked area
min_checked_share = 0.3   # warn when less of the window could be checked (unknown colours, a scan)

# ---------------------------------------------------------------- Braille
# Physical size of Braille dots; never scaled with the map.
[braille]
dot_diameter_mm = 1.5
dot_height_mm = 0.6
dot_spacing_mm = 2.5
cell_spacing_mm = 6.0
line_spacing_mm = 10.0

# ---------------------------------------------------------------- texture library
# Raised patterns a class can use by name (texture = "dots"), or "none".
# kind: "dots" | "rings" | "lines" (straight ridges) | "waves" (wavy ridges).
# pitch_mm: distance between dots or ridges; size_mm: dot/ring diameter or ridge width;
# height_mm: how far the pattern stands out; angle_deg: direction of ridges.
[texture.dots]                      # guidebook: open land
kind = "dots"
pitch_mm = 3.0
size_mm = 1.2
height_mm = 0.5
[texture.rings]                     # guidebook: forest (curls)
kind = "rings"
pitch_mm = 4.0
size_mm = 2.4
height_mm = 0.5
[texture.hatching]                  # guidebook: forbidden area
kind = "lines"
pitch_mm = 3.0
size_mm = 1.0
height_mm = 0.5
angle_deg = 45
[texture.waves]                     # guidebook: water
kind = "waves"
pitch_mm = 3.0
size_mm = 0.8
height_mm = 0.4
[texture.stripes]                   # fine straight ridges, east-west (used by canopy)
kind = "lines"
pitch_mm = 2.5
size_mm = 0.8
height_mm = 0.4
angle_deg = 0

# ---------------------------------------------------------------- tactile classes
# role: "terrain" (areas that tile the map), "object" (on top), "ignore" (not shown).
# enabled: false = not shown. A terrain class that is off gives its area to merge_into.
# height_mm: top above the base plate (negative = recessed).
# texture: a name from the texture library, "none", or an inline table.
# shape (objects): "dot" | "ring" | "cross" draws every instance as that standard symbol
#   of size_mm, whatever it looks like on the source map; "as_drawn" = as on the map,
#   widened to min_width_mm.
# label: Braille label in the legend (short; no accents).
# colour: [r, g, b] for previews, and the suggested filament colour of the part.

[class.paved]                       # guidebook: paved area (smooth)
role = "terrain"
colour = [245, 220, 196]
height_mm = 0.0
texture = "none"
label = "paved"
[class.open_land]                   # guidebook: grass, open land (dots)
role = "terrain"
colour = [254, 191, 80]
height_mm = 0.5
texture = "dots"
label = "open land"
[class.forest]                      # guidebook: forest (curls -> small rings)
role = "terrain"
colour = [255, 255, 255]
height_mm = 1.0
texture = "rings"
label = "forest"
[class.forbidden]                   # guidebook: forbidden area (hatching)
role = "terrain"
colour = [180, 179, 22]
height_mm = 1.5
texture = "hatching"
label = "forbidden"
[class.building]                    # guidebook: building (solid)
role = "terrain"
colour = [138, 140, 142]
height_mm = 3.0
texture = "none"
label = "building"
[class.water]                       # guidebook: body of water (waves), recessed
role = "terrain"
colour = [0, 157, 221]
height_mm = -0.8
texture = "waves"
label = "water"
[class.canopy]                      # ISSprOM 522 canopy (portici, galleries). Off: shown as paved,
role = "terrain"                    # as in the guidebook. On: flat, with fine stripes.
enabled = false
merge_into = "paved"
colour = [209, 211, 212]
height_mm = 0.0
texture = "stripes"
label = "canopy"

[class.barrier]                     # guidebook: uncrossable barrier (fence, wall)
role = "object"
colour = [35, 31, 32]
height_mm = 3.5
min_width_mm = 1.0
shape = "as_drawn"
label = "barrier"
[class.tree]                        # guidebook: tree (dot)
role = "object"
colour = [45, 180, 87]
height_mm = 2.5
min_width_mm = 1.0
shape = "dot"
size_mm = 2.5
merge_gaps = false
label = "tree"
[class.boulder]                     # guidebook: boulder (ring); no rule matches it yet
role = "object"
colour = [35, 31, 32]
height_mm = 2.5
min_width_mm = 0.8
shape = "ring"
size_mm = 3.0
merge_gaps = false
label = "boulder"
[class.man_made_object]             # guidebook: man-made object (cross)
role = "object"
colour = [35, 31, 32]
height_mm = 2.5
min_width_mm = 0.9
shape = "cross"
size_mm = 3.5
merge_gaps = false
label = "object"
[class.footpath]                    # ISSprOM 505 footpath (dashed). Off by default. On: a raised
role = "object"                     # line; merge_close_objects joins its dashes.
enabled = false
colour = [35, 31, 32]
height_mm = 2.0
min_width_mm = 1.0
shape = "as_drawn"
label = "path"
[class.contour]                     # ISOM 101 contour. Off by default. On: low ridges.
role = "object"
enabled = false
colour = [207, 117, 24]
height_mm = 1.8
min_width_mm = 0.8
shape = "as_drawn"
merge_gaps = false
label = "contour"

# Not shown on the tactile map (no tactile use, or decoration of other symbols).
[class.outline]
role = "ignore"
[class.dotted_line]
role = "ignore"
[class.black_dots]
role = "ignore"
[class.vegetation_line]
role = "ignore"
[class.course]
role = "ignore"
[class.north_line]
role = "ignore"
[class.grey_line]
role = "ignore"
[class.unclassified]
role = "ignore"

# ---------------------------------------------------------------- symbol rules
# kind: "fill" | "stroke" | "dots" | "any". rgb matched within rgb_tol (default 3).
# Optional: min_width_mm / max_width_mm (strokes), min_extent_mm / max_extent_mm
# (bbox of the source path), dot_mm / pitch_mm (dot screens, matched within 15 %),
# vertical = true (only straight lines within 3 degrees of the page's vertical: north lines).
# The isom field records which map symbol a rule stands for ("?" = to be checked).

# -- open land (yellow family)
[[symbol]]
class = "open_land"
isom = "403 rough open land (half-strength yellow)"
kind = "fill"
rgb = [255, 209, 131]
[[symbol]]
class = "open_land"
isom = "402 / 404 open land with scattered trees (white dots on yellow)"
kind = "dots"
rgb = [255, 255, 255]
[[symbol]]
class = "open_land"
isom = "402 open land with scattered trees"
kind = "dots"
rgb = [254, 191, 80]
dot_mm = 0.615
pitch_mm = 0.70
[[symbol]]
class = "open_land"
isom = "412 orchard"
kind = "dots"
rgb = [45, 180, 87]
dot_mm = 0.62
pitch_mm = 1.12
[[symbol]]
class = "open_land"
isom = "415 cultivated land"
kind = "dots"
rgb = [35, 31, 32]
dot_mm = 0.28
pitch_mm = 1.12
[[symbol]]
class = "open_land"
isom = "401 open land"
kind = "fill"
rgb = [254, 191, 80]
[[symbol]]
class = "open_land"
isom = "403 rough open land?"
kind = "fill"
rgb = [255, 221, 164]

