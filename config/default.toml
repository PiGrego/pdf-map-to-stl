# pdf-map-to-stl configuration.
#
# [[symbol]] rules recognise PDF paint operations; the first matching rule wins.
# [class.*] says what each recognised class becomes in the tactile model.
# All sizes are millimetres: on the PDF page for symbol rules, on the printed model
# for [output] and [class.*].
#
# The symbol rules below are calibrated on samples/sample.pdf (a sprint map exported
# from OCAD). Symbol codes follow ISOM 2000 / ISSprOM; codes marked "?" are guesses
# that still need checking against the map legend.

[output]
width_mm = 120.0          # printed model width; the crop is scaled to this
base_mm = 2.0             # base plate thickness
min_area_mm2 = 0.4        # terrain pieces smaller than this are dropped (untouchable)

# ---------------------------------------------------------------- tactile classes
# role: "terrain" = area classes that tile the map; what is visible after paint order.
#       "object"  = raised features placed on top (walls, hedges, trees); built from
#                   their own outline, never cut by what is painted above them.
#       "ignore"  = not part of the tactile model (course, contours, grid lines).
# height_mm: top of the feature above the base plate. Negative = recessed into it.
# min_width_mm (objects): lines are widened to at least this on the model.

[class.paved]
role = "terrain"
height_mm = 0.0
[class.paved_alt]
role = "terrain"
height_mm = 0.0
[class.open_land]
role = "terrain"
height_mm = 0.4
[class.open_land_scattered_trees]
role = "terrain"
height_mm = 0.4
[class.rough_open]
role = "terrain"
height_mm = 0.4
[class.forest]
role = "terrain"
height_mm = 0.8
[class.vegetation_slow]
role = "terrain"
height_mm = 1.0
[class.vegetation_difficult]
role = "terrain"
height_mm = 1.2
[class.vegetation_impassable]
role = "terrain"
height_mm = 1.4
[class.out_of_bounds]
role = "terrain"
height_mm = 1.6
[class.canopy]
role = "terrain"
height_mm = 0.2
[class.building]
role = "terrain"
height_mm = 2.5
[class.water]
role = "terrain"
height_mm = -0.6

[class.wall]
role = "object"
height_mm = 1.8
min_width_mm = 0.8
[class.hedge]
role = "object"
height_mm = 1.6
min_width_mm = 1.0
[class.tree]
role = "object"
height_mm = 1.6
min_width_mm = 1.2
[class.vegetation_line]
role = "object"
height_mm = 1.2
min_width_mm = 0.6

[class.outline]
role = "ignore"
[class.contour]
role = "ignore"
[class.course]
role = "ignore"
[class.north_line]
role = "ignore"
[class.grey_line]
role = "ignore"
[class.unclassified]
role = "ignore"

# ---------------------------------------------------------------- symbol rules
# kind: "fill" | "stroke" | "dots" | "any". rgb matched within rgb_tol (default 3).
# Optional: min_width_mm / max_width_mm (strokes), min_extent_mm / max_extent_mm
# (bbox of the source path), dot_mm / pitch_mm (dot screens, matched within 15 %).

[[symbol]]
class = "open_land_scattered_trees"
isom = "402"
kind = "dots"
rgb = [254, 191, 80]
dot_mm = 0.615
pitch_mm = 0.70

[[symbol]]
